name: Backend CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Test and package backend
        run: ./gradlew test bootJar --no-daemon
      - name: Verify admin panel
        working-directory: admin-panel
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --audit-level=high
      - name: Validate container image
        run: docker build --tag duelingo-backend:ci .
      - uses: actions/upload-artifact@v7
        with:
          name: backend-and-admin
          path: |
            build/libs/*.jar
            admin-panel/dist
          if-no-files-found: error
