services:
  - type: web
    name: duelrush-api-2026
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    # Liveness must stay independent from slow free-tier databases. The full
    # /actuator/health endpoint remains available for operational diagnostics.
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: duelrush-postgres
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: duelrush-postgres
          property: port
      - key: SPRING_DATASOURCE_DATABASE
        fromDatabase:
          name: duelrush-postgres
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: duelrush-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: duelrush-postgres
          property: password
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: duelrush-cache
          property: connectionString
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SPRING_MAIL_HOST
        value: smtp.gmail.com
      - key: SPRING_MAIL_PORT
        value: 587
      - key: SPRING_MAIL_AUTH
        value: true
      - key: SPRING_MAIL_STARTTLS
        value: true
      - key: APP_MAIL_FROM
        value: duelrush.app@gmail.com
      - key: ALLOWED_ORIGINS
        value: https://duelrush-admin-2026.onrender.com
      - key: APP_PUBLIC_BASE_URL
        value: https://duelrush-api-2026.onrender.com
      - key: APP_AVATAR_DIRECTORY
        value: /tmp/duelrush/avatars

  - type: web
    name: duelrush-admin-2026
    runtime: static
    buildCommand: cd admin-panel && npm ci && npm run build
    staticPublishPath: admin-panel/dist
    envVars:
      - key: VITE_API_URL
        value: https://duelrush-api-2026.onrender.com
      - key: VITE_SUPPORT_EMAIL
        value: duelrush.app@gmail.com
      - key: VITE_OPERATOR_NAME
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: duelrush-cache
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: duelrush-postgres
    databaseName: duelrush
    user: duelrush
    region: frankfurt
    plan: free
    postgresMajorVersion: "15"
    ipAllowList: []
