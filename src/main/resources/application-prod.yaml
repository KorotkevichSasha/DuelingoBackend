logging:
  level:
    root: INFO
    by.gsu.duelingobackend: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

spring:
  main:
    lazy-initialization: true

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    # Render exposes discrete connection properties. Building the JDBC URL from
    # them avoids the unsupported postgresql://user:password@host form.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DATABASE}}

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      auto-index-creation: false

    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    default-encoding: UTF-8
    test-connection: ${SPRING_MAIL_TEST_CONNECTION:false}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:true}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:true}
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:5000}

server:
  # Render health-checks port 10000. SERVER_PORT remains available for other hosts.
  port: ${SERVER_PORT:10000}
  address: 0.0.0.0
  error:
    include-message: never
    include-stacktrace: never

jwt:
  token:
    signing:
      key: ${JWT_SIGNING_KEY}

  access-token:
    expiration: 7200000 # 2 hours in milliseconds

  refresh-token:
    expiration: 604800000 # 7 days in milliseconds

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

app:
  public-base-url: ${APP_PUBLIC_BASE_URL}
  mail:
    from: ${APP_MAIL_FROM:${SPRING_MAIL_USERNAME}}
  email-verification:
    delivery-enabled: ${EMAIL_VERIFICATION_DELIVERY_ENABLED:true}
    test-code: ${EMAIL_VERIFICATION_TEST_CODE:}
  storage:
    avatar-directory: ${APP_AVATAR_DIRECTORY:/app/uploads/avatars}
  security:
    allowed-origins: ${ALLOWED_ORIGINS}
