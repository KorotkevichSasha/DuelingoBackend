spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5438/duelingo_db}

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      auto-index-creation: true

    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:no-reply@duelrush.local}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:false}

server:
  address: 0.0.0.0
  port: 8082

jwt:
  token:
    signing:
      key: ${JWT_SIGNING_KEY}

  access-token:
    expiration: 7200000 # 2 hours in milliseconds

  refresh-token:
    expiration: 604800000 # 7 days in milliseconds

logging:
  level:
    root: INFO
    by.gsu.duelingobackend: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.messaging: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.authentication: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8082}
  mail:
    from: ${APP_MAIL_FROM:no-reply@duelrush.local}
  email-verification:
    delivery-enabled: ${EMAIL_VERIFICATION_DELIVERY_ENABLED:true}
    test-code: ${EMAIL_VERIFICATION_TEST_CODE:}
  storage:
    avatar-directory: ${APP_AVATAR_DIRECTORY:uploads/avatars}
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
